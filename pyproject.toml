[project]
name = "infera-studio"
version = "1.3.0"
description = "Electron desktop chat for local llama.cpp models"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
legacy-qt = ["PySide6>=6.8", "Markdown>=3.8", "Pygments>=2.18"]

[project.scripts]
infera-studio = "infera_studio.desktop.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infera_studio", "infera_studio.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly selected local GGUF and llama-server"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
